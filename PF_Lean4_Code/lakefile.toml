name = "PF"
version = "0.1.0"
defaultTargets = ["pf"]

[[lean_lib]]
name = "PF"

# The mathlib-upstream candidates live outside the PF namespace and import ONLY
# mathlib.  Keeping them as a lean_lib means `lake build MathlibCandidates`
# re-verifies them on every mathlib bump, instead of them rotting in a folder.
[[lean_lib]]
name = "MathlibCandidates"
srcDir = "../mathlib_candidates"
roots = ["GramLinearIndependent", "TateLimit", "HilbertSchmidt", "TransferOperatorCompact"]

[[lean_exe]]
name = "pf"
root = "Main"

# Mathlib dependency for formal verification
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.24.0-rc1"  # Compatible with Lean 4.24.0

# Vendored girving/interval (kernel-verified interval arithmetic) — RH-arc Route B
# numerics engine. See vendor/interval/VENDORING.md; `interval` tactic is BANNED
# (native_decide) — use `approx` + Interval.approx_lt/approx_le + decide +kernel.
[[require]]
name = "interval"
path = "../vendor/interval"
