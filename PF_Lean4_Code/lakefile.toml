name = "PF"
version = "0.1.0"
defaultTargets = ["pf"]

[[lean_lib]]
name = "PF"
globs = ["PF.+"]

# The mathlib-upstream candidates live outside the PF namespace and import ONLY
# mathlib.  Keeping them as a lean_lib means `lake build MathlibCandidates`
# re-verifies them on every mathlib bump, instead of them rotting in a folder.
[[lean_lib]]
name = "MathlibCandidates"
srcDir = "../mathlib_candidates"
roots = ["GramLinearIndependent", "TateLimit", "HilbertSchmidt", "TransferOperatorCompact", "TransferOperatorTrace", "NotFermat42Sub"]

# CI TARGET. `PF` above uses globs = ["PF.+"], i.e. ALL ~10,870 modules including
# the 1,265 standalone leaf panels, which cannot finish inside a GitHub runner's
# 6-hour job cap. This target has roots and NO globs, so it builds PF.lean and its
# transitive imports only -- the 1,641-module closure that the referee-proof claim
# actually rests on, and which is complete. Panels stay on the PF target, built on
# Legion/Acer, and do not gate CI.
[[lean_lib]]
name = "PFClosure"
roots = ["PF"]

[[lean_exe]]
name = "pf"
root = "Main"

# Mathlib dependency for formal verification
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.24.0-rc1"  # Compatible with Lean 4.24.0

# Vendored girving/interval (kernel-verified interval arithmetic) — RH-arc Route B
# numerics engine. See vendor/interval/VENDORING.md; `interval` tactic is BANNED
# (native_decide) — use `approx` + Interval.approx_lt/approx_le + decide +kernel.
[[require]]
name = "interval"
path = "../vendor/interval"
