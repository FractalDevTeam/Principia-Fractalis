name: Verify (Lean 4 kernel-only axiom check)

# Runs the corpus's own verification script on every push to master.
# Outcome (PASS / FAIL) gates the green/red badge displayed in README.md.
#
# Runs on the GitHub-hosted `ubuntu-latest` runner as of the 2026-11-20
# stopgap; see the note on the job below for why the self-hosted target
# was reverted. Pull-request triggers are intentionally DISABLED: with a
# public repository and a self-hosted runner, fork-PR workflows would
# allow arbitrary code execution on the host machine. That exposure is
# dormant while this runs GitHub-hosted, and the trigger stays off so it
# does not come back silently the next time a self-hosted runner is
# wired up. Verification fires only on pushes to master, which the
# maintainer controls.
#
# What this workflow checks:
#   - The PF target builds clean.
#   - Each of the three AxiomCheck_* modules builds — a checker that
#     fails to build emits no axioms, and an empty log must never read
#     as a clean bar.
#   - Every axiom name reported by `#print axioms`, inspected one token
#     at a time against the contract in verify.sh:
#       Category A  kernel axioms (propext, Classical.choice, Quot.sound)
#                   — permitted.
#       Category B  the named citation axioms — permitted, and every
#                   occurrence is listed with the theorem carrying it.
#       Category C  anything else, `sorryAx` and project-level `axiom`
#                   declarations included — any occurrence FAILS.
#
# Exit codes surfaced by verify.sh:
#   0 PASS · 1 build/environment failure · 2 axiom outside contract
#   3 INCONCLUSIVE (no axiom output gathered — never reported as pass)
#
# What this workflow does NOT check:
#   - The paper's prose (LaTeX).
#   - The Layer 3 numerical correspondences in §4 of the paper.
#   - The IBM Quantum forward prediction (§6) — that requires hardware.
#   - The Lean4Lean independent kernel re-verification (separate package).
#
# 2026-11-16 repair note. Between this workflow's creation and 2026-11-16
# it ran 1,223 times with zero successes: 1,216 cancelled, 6 failed. The
# cancellations were caused by `cancel-in-progress: true` on a group keyed
# only by ref — with a ~16 minute build and pushes minutes apart, every
# run was killed by the next commit, so master never received a verdict.
# Cancellation is now limited to pull requests, where a new head commit
# genuinely supersedes the old one. Pushes to master queue instead, which
# means a burst of commits produces a backlog of serial runs rather than a
# row of cancellations; that is the intended trade.
# The six genuine failures all occurred inside verify.sh's toolchain
# block (three of them in under 16 seconds, before any Lean ran) and are
# now reported with explicit environment diagnostics.

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Master pushes queue rather than cancelling: a burst of commits
  # produces a serial backlog of verdicts, not a row of cancellations.
  # (Pull-request triggers are disabled above, so a
  # pull_request-conditional cancel would be a no-op anyway.)
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # 2026-11-20 STOPGAP. The previous value was
    # `[self-hosted, linux, X64, acer]`, but no self-hosted runner has ever
    # been registered on this repository: no Runner.Listener process, no
    # runner directory, no systemd unit, no container, on either machine.
    # Every run after that switch sat `queued` forever waiting for a label
    # nothing answers — which is worse than failing, because the badge
    # shows no change rather than going red. Reverted to the GitHub-hosted
    # runner so the gate reports again.
    #
    # Known limitation of this stopgap: `ubuntu-latest` has ~16 GB of RAM,
    # and the RiemannXiBox panels were measured on 2026-11-20 at a
    # consistent 10.4-10.6 GB peak RSS each (11 of them, Legion WSL). The
    # swap step below is what makes a 10.5 GB elaboration survivable here.
    # This is still the weaker box; the durable fix is a registered runner
    # on a host with real memory.
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The panels need ~10.5 GB each. A GitHub runner has ~16 GB with no
      # usable swap by default, which leaves no margin for the rest of the
      # build. Replace the small default swapfile with 14 GB.
      - name: Provision swap for the panel elaborations
        run: |
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 14G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "--- after ---"
          free -h
        shell: bash

      # Runs in about a second, before anything expensive, and proves the
      # axiom classifier still detects sorryAx and project axioms. If a
      # later step is cancelled or times out, this one has already
      # established that the gate is capable of failing.
      - name: Self-test the axiom gate (proves it can fail)
        run: PF_VERIFY_SELFTEST=1 bash ./verify.sh
        shell: bash

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('PF_Lean4_Code/lean-toolchain') }}

      # 2026-11-25. The single `actions/cache` step this replaces could never
      # work. `actions/cache` saves ONLY on job success and the key ended in
      # ${{ github.sha }}, so every commit missed -- the run log reads
      # "Cache not found for input keys" every time. Success needed the cache and
      # the cache needed success, so each run rebuilt all 1,651 closure modules
      # from zero and was killed near 55 minutes (exit 143).
      #
      # Split into restore + save, with the save under `if: always()`, so a run
      # that is killed still publishes the oleans it managed to produce and the
      # next run resumes from them. The save key carries github.run_id so runs
      # never collide; restore-keys prefix-match picks up the newest.
      #
      # Only build/lib is cached. Measured on Legion: the closure's oleans and
      # ileans are 0.45 GiB (3,302 artifacts), comfortably inside the 10 GB
      # per-repo budget, whereas the whole .lake is 26 GB -- 15 GB of build/lib
      # for all 10,870 modules and 4.8 GB of generated C. mathlib is not cached
      # here at all: `lake exe cache get` fetches its 4.28 GiB from mathlib's own
      # CDN in about a minute.
      - name: Restore PF closure build cache
        uses: actions/cache/restore@v4
        with:
          path: PF_Lean4_Code/.lake/build/lib
          key: pfclosure-${{ runner.os }}-${{ hashFiles('PF_Lean4_Code/lean-toolchain', 'PF_Lean4_Code/lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            pfclosure-${{ runner.os }}-${{ hashFiles('PF_Lean4_Code/lean-toolchain', 'PF_Lean4_Code/lake-manifest.json') }}-
            pfclosure-${{ runner.os }}-

      - name: Run ./verify.sh
        run: |
          bash ./verify.sh
        shell: bash
      # Publishes partial progress even when the build step is killed. This is
      # the half that breaks the save-only-on-success deadlock, so it must stay
      # `if: always()`.
      - name: Save PF closure build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: PF_Lean4_Code/.lake/build/lib
          key: pfclosure-${{ runner.os }}-${{ hashFiles('PF_Lean4_Code/lean-toolchain', 'PF_Lean4_Code/lake-manifest.json') }}-${{ github.run_id }}

