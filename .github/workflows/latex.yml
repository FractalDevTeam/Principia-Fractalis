name: LaTeX Build

on:
  push:
    branches: ["master"]
    paths:
      - 'Principia_Fractalis_master_folder/**'
      - '.github/workflows/latex.yml'
  pull_request:
    branches: ["master"]
    paths:
      - 'Principia_Fractalis_master_folder/**'
  workflow_dispatch:

concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: Principia_Fractalis_master_folder
          root_file: main.tex
          # lualatex preferred because the manuscript uses Unicode
          # mathematics ('×' for \times, emojis 🟢🟡🔴 as level markers).
          # pdflatex (the default) errors on these under stricter TeX Live
          # releases (2025+); lualatex handles them natively.
          latexmk_use_lualatex: true
          # latexmk handles bibtex + rerun-as-needed automatically.
          # halt-on-error removed so a single chapter typo does not block
          # the entire artifact upload.
          args: -lualatex -interaction=nonstopmode -file-line-error

      - name: Upload main.pdf as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: principia-fractalis-pdf
          path: Principia_Fractalis_master_folder/main.pdf
          retention-days: 90

      - name: Attach main.pdf to release (on tagged commits)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Principia_Fractalis_master_folder/main.pdf
