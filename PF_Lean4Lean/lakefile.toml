name = "PF_L4L"
version = "0.1.0"
defaultTargets = ["PF_L4L"]

[[lean_lib]]
name = "PF_L4L"

[[require]]
name = "PF"
path = "../PF_Lean4_Code"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.24.0-rc1"

# 2026-08-25: PF now transitively requires the vendored girving/interval
# package (for r120's certified interval-arithmetic quadrature).  L4L must
# expose the same require so `lake` can resolve the transitive dependency
# through the PF path package.  See ../vendor/interval/VENDORING.md.
[[require]]
name = "interval"
path = "../vendor/interval"
